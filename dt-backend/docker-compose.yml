version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: scaap-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: scaap-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    container_name: scaap-api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGO_URI: mongodb://admin:password@mongodb:27017/scaap?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key-change-in-production
      VERIFICATION_SECRET: dev-verification-secret
      S3_BUCKET: scaap-bucket
      AWS_REGION: us-east-1
      CORS_ORIGIN: http://localhost:5173
      AI_API_BASE_URL: http://localhost:5000
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./:/app
      - /app/node_modules

  worker:
    build: .
    container_name: scaap-worker
    command: npm run worker
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://admin:password@mongodb:27017/scaap?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key-change-in-production
      VERIFICATION_SECRET: dev-verification-secret
      AI_API_BASE_URL: http://localhost:5000
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./:/app
      - /app/node_modules

volumes:
  mongodb_data:
  redis_data:
